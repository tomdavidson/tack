# <tack>/tackrc-defaults.yml
# Defaults for every user-configurable tack setting.
# Consumers override subsets in <consumer-root>/tackrc.yml.
# tack.sh deep-merges this file with the consumer's tackrc.yml; the result
# is the single runtime controller for all of tack.

moon:
  toolchains:
    - javascript
    - rust
  workspace_base_source: local
  workspace_base_ref: main

pkgs:
  - configs/*
  - scripts
  - .github
  - .moon

#pkgs-exclude:

vars:
  # devcontainer vars: consumed by configs/devcontainer.
  # image and digest must be set by the consumer; they have no default because
  # the digest is only known after the tack-dev image is published.
  # devcontainer:
  #   image: ghcr.io/tomdavidson/tack-dev
  #   digest: sha256:<digest-from-image-ci-job-summary>
  #   user: dev
  #   ports: []

  # devenv vars: consumed by configs/devenv.
  # nixpkgs_ref should match the ref used in images/tack-dev/Containerfile.
  devenv:
    nixpkgs_ref: nixos-25.11
    packages: []
    env: {}
    # Extra devenv modules to import from the .tack submodule, rendered into
    # devenv.nix `imports = [ ... ]`. Language packs that need packages/env/
    # scripts ship a module here instead of a devenv.concat.nix fragment
    # (a second `packages = ...` in one attrset is a Nix error).
    imports: []

  # python vars: consumed by configs/python.
  #
  # Interpreter versions are NOT configured here. uv owns them per moon
  # project via .python-version / requires-python (UV_MANAGED_PYTHON=1 is
  # set by python.nix so a system Python is never used). ruff is pinned in
  # configs/common/.prototools; basedpyright and pytest are uv dev deps
  # locked in uv.lock.
  #
  # Enable the pack:
  #   pkgs:
  #     - configs/common
  #     - configs/devenv
  #     - configs/python
  #   vars:
  #     devenv:
  #       imports:
  #         - ./.tack/configs/python/python.nix
  #
  # Do not add `uv` to bwrap.tools below; python.nix defines the sandboxed
  # `uv` script itself and a second definition is a module conflict.
  # python: {}

  # drupal vars: consumed by configs/drupal + configs/devenv.
  #
  # variant selects the devenv Nix module to import. The rendered devenv.nix
  # will contain:
  #   imports = [ ./.tack/configs/drupal/variants/<variant>.nix ];
  #
  # Available variants (configs/drupal/variants/):
  #   localgov-multisite  FrankenPHP + MariaDB 11.4 + PHP 8.3 + Drupal tasks
  #
  # Uncomment to enable:
  # drupal:
  #   variant: localgov-multisite

  # bwrap sandbox vars: consumed by configs/devenv.
  # enabled: render bwrap-run wrappers and add pkgs.bubblewrap/apparmor-utils.
  # tools: which commands get an `exec bwrap-run <tool>` devenv script.
  #
  # dev_root_depth: render env.BWRAP_DEV_ROOT as N directories above the
  #   repo (computed from config.devenv.root, so the committed devenv.nix
  #   carries no home path). bwrap-run then binds that whole tree writable
  #   and keeps caches in <dev_root>/.bwrap (pnpm hardlinks, uv pythons).
  #     ~/Projects/<org>/<repo>  -> dev_root_depth: 2  -> ~/Projects
  #     ~/dev/<repo>             -> dev_root_depth: 1  -> ~/dev (bwrap-run default)
  #   Unset: bwrap-run auto-detects ~/dev, else binds only the repo.
  # dev_root: absolute path alternative; machine-specific, prefer depth.
  #   Ignored when dev_root_depth is set.
  bwrap:
    enabled: true
    # dev_root_depth: 2
    # dev_root: /home/me/Projects
    tools:
      - node
      - npx
      - pnpm
      - moon
      - cargo
      - rustc
