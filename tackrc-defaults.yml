# <tack>/tackrc-defaults.yml
# Defaults for every user-configurable tack setting.
# Consumers override subsets in <consumer-root>/tackrc.yml.
# tack.sh deep-merges this file with the consumer's tackrc.yml; the result
# is the single runtime controller for all of tack.

moon:
  toolchains:
    - javascript
    - rust
  workspace_base_source: local
  workspace_base_ref: main

pkgs:
  - configs/*
  - scripts
  - .github
  - .moon

pkgs-exclude:
  - configs/direnv

# All tera-visible configuration lives under vars:. tack.sh renders
# templates with the merged tackrc as the tera context, so `vars.foo` in a
# template reads `vars: { foo: ... }` below. Consumers override subsets of
# these keys in their tackrc.yml under the same vars: paths.
vars:
  # devcontainer vars: consumed by configs/devcontainer.
  # image and digest must be set by the consumer; they have no default because
  # the digest is only known after the tack-dev image is published.
  # devcontainer:
  #   image: ghcr.io/tomdavidson/tack-dev
  #   digest: sha256:<digest-from-image-ci-job-summary>
  #   user: dev
  #   ports: []

  # devenv vars: consumed by configs/devenv.
  # nixpkgs_ref should match the ref used in images/tack-dev/Containerfile.
  # languages and services are set per-consumer via stack-specific configs packages.
  devenv:
    nixpkgs_ref: nixos-25.05
    packages: []
    env: {}

  # sbx vars: consumed by configs/devenv (bubblewrap sandbox wrappers).
  # enabled: render sbx scripts + tack flake input into devenv.
  # tools: which commands get an `exec sbx <tool>` devenv script. Proto tool
  #   IDs (node, pnpm, moon) resolve via `proto bin`; proto bins (npx)
  #   resolve via proto shims; rust bins (cargo, rustc) resolve via
  #   ~/.cargo/bin. moon is wrapped at the moon level, not per task.
  # input_url: devenv.yaml URL for the tack flake input; override for forks
  #   or local checkouts (path:/path/to/tack).
  sbx:
    enabled: true
    input_url: github:tomdavidson/tack
    tools:
      - node
      - npx
      - pnpm
      - moon
      - cargo
      - rustc
