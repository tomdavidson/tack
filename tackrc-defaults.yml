# <tack>/tackrc-defaults.yml
# Defaults for every user-configurable tack setting.
# Consumers override subsets in <consumer-root>/tackrc.yml.
# tack.sh deep-merges this file with the consumer's tackrc.yml; the result
# is the single runtime controller for all of tack.

moon:
  toolchains:
    - javascript
    - rust
  workspace_base_source: local
  workspace_base_ref: main

pkgs:
  - configs/*
  - scripts
  - .github
  - .moon

#pkgs-exclude:


vars:
  # devcontainer vars: consumed by configs/devcontainer.
  # image and digest must be set by the consumer; they have no default because
  # the digest is only known after the tack-dev image is published.
  # devcontainer:
  #   image: ghcr.io/tomdavidson/tack-dev
  #   digest: sha256:<digest-from-image-ci-job-summary>
  #   user: dev
  #   ports: []

  # devenv vars: consumed by configs/devenv.
  # nixpkgs_ref should match the ref used in images/tack-dev/Containerfile.
  devenv:
    nixpkgs_ref: nixos-25.11
    packages: []
    env: {}

  # drupal vars: consumed by configs/drupal + configs/devenv.
  #
  # variant selects the devenv Nix module to import. The rendered devenv.nix
  # will contain:
  #   imports = [ ./.tack/configs/drupal/variant/<stack>.nix ];
  #
  # Available variant (configs/drupal/variant/):
  #   localgov-multisite  FrankenPHP + MariaDB 11.4 + PHP 8.3 + Drupal tasks
  #
  # Uncomment to enable:
  # drupal:
  #   variant: localgov-multisite

  # bwrap sandbox vars: consumed by configs/devenv.
  # enabled: render bwrap-run wrappers and add pkgs.bubblewrap/apparmor-utils.
  # tools: which commands get an `exec bwrap-run <tool>` devenv script.
  bwrap:
    enabled: true
    tools:
      - node
      - npx
      - pnpm
      - moon
      - cargo
      - rustc
