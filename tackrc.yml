# <TACK_ROOT>/tackrc.yml
# Tack dogfooding itself: tack's own repo-root tackrc.

overrides:
  configs/common:
    exclude:
      - .prototools
  configs/javascript:
    exclude:
      - .prototools
  configs/web:
    exclude: ["**"]
  scripts:
    exclude: ["**"]
  .moon:
    exclude: ["**"]
  .github:
    exclude: ["**"]
