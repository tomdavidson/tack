# <TACK_ROOT>/tackrc.yml
# Tack dogfooding itself: tack's own repo-root tackrc.

overrides:
  # This repo owns its root .gitattributes/.gitignore (they are the source
  # of the shipped copies). Consumers do get them; only tack itself skips.
  configs/common:
    exclude:
      - .gitattributes
      - .gitignore
      - dprint.copy.json
  # Same reasoning: this repo's .github/ is hand-maintained.
  configs/renovate:
    exclude:
      - .github/renovate.json5
  # Packages this repo cannot consume:
  #   devcontainer  needs vars.project.name / vars.devcontainer.* (no defaults)
  #   devenv, php   no devenv.nix here
  #   drupal        would create a root composer.json via merge
  #   rust          would create a root Cargo.toml via concat
  #   python        would seed a root ruff.toml; this repo has no Python
  configs/devcontainer:
    exclude: ["**"]
  configs/python:
    exclude: ["**"]
  configs/devenv:
    exclude: ["**"]
  configs/php:
    exclude: ["**"]
  configs/drupal:
    exclude: ["**"]
  configs/rust:
    exclude: ["**"]
  configs/web:
    exclude: ["**"]
  scripts:
    exclude: ["**"]
  .moon:
    exclude: ["**"]
  .github:
    exclude: ["**"]
