$schema: "https://moonrepo.dev/schemas/project.json"

# Root project config, shared by every consumer. tack links this file to
# <consumer>/moon.yml (files.moon.yml.target in .moon/tack.yml), so it is
# the same file in tack and in every consumer, including tack itself, which
# dog-foods the .moon package. Only workspace-generic tasks belong here.
# Repo-specific root tasks go in an inherited task file with an
# `inheritedBy` condition (tack's own live in .moon/tasks/tack-internal.yml);
# consumers put theirs in a project, not in this file (ADR-0009).

tags:
  - "tooling"

tasks:
  sync-release:
    script: "bun $MOON_WORKSPACE_ROOT/.moon/scripts/sync-release-please.ts"
    inputs:
      - "/plugins/*/package.json"
      - "/apps/*/package.json"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    script: "dprint fmt"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
      # Workspace-rooted /**/* returns pnpm's dependency symlinks under
      # packages/*/node_modules despite .gitignore; the hasher then warns
      # "only files can be hashed" for each. See #32.
      - "!**/node_modules/**"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      affectedFiles: args

  fmt-check:
    script: "dprint check"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
      - "!**/node_modules/**"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: true

  lint-sh:
    script: shellcheck **/*.sh
    inputs:
      - "**/*.sh"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: args

  lint:
    command: "noop"
    deps:
      - "~:lint-sh"

  lint-fix:
    command: "noop"
    deps:
      - "~:lint-sh"
    options:
      runInCI: false

  fix:
    command: "noop"
    deps:
      - "~:fmt"
      - "~:lint-fix"
    options:
      runInCI: false
      runDepsInParallel: false

  verify:
    command: "noop"
    deps:
      - "~:fmt-check"
      - "~:lint"
    options:
      runInCI: false
