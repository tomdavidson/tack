$schema: "https://moonrepo.dev/schemas/project.json"

tags:
  - "tooling"

tasks:
  sync-release:
    script: "bun $MOON_WORKSPACE_ROOT/.moon/scripts/sync-release-please.ts"
    inputs:
      - "/plugins/*/package.json"
      - "/apps/*/package.json"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    script: "dprint fmt"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      affectedFiles: args

  fmt-check:
    script: "dprint check"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: true

  lint-sh:
    script: shellcheck **/*.sh
    inputs:
      - "**/*.sh"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: args

  lint:
    command: "noop"
    deps:
      - "~:lint-sh"

  test:
    # bats and its helper libs come from the pnpm catalog (package.json),
    # not a system install; bats_load_library resolves them via BATS_LIB_PATH.
    command: pnpm exec bats --jobs ${MOON_THREADS:-$(nproc)} tests/ configs/devenv/tests/
    env:
      BATS_LIB_PATH: "$workspaceRoot/node_modules"
    # Root-level tasks default to NO inputs (moon >= 1.24), so without this
    # list the task hash never changes and moon replays the cached result
    # regardless of edits to tack.sh or the suite.
    inputs:
      - "tack.sh"
      - "tackrc.yml"
      - "tackrc-defaults.yml"
      - "tests/**/*"
      - "tests/**/.*"
      - "configs/**/*"
      - "configs/**/.*"
      - ".moon/tack.yml"
      - ".moon/*.yml"
      - ".moon/tasks/**/*"
      - ".moon/templates/**/*"
      - "package.json"
      - "pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
