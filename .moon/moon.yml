$schema: "https://moonrepo.dev/schemas/project.json"

tags:
  - "tooling"

tasks:
  sync-release:
    script: "bun $MOON_WORKSPACE_ROOT/.moon/scripts/sync-release-please.ts"
    inputs:
      - "/plugins/*/package.json"
      - "/apps/*/package.json"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    script: "dprint fmt"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      affectedFiles: args

  fmt-check:
    script: "dprint check"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: true

  lint-sh:
    script: shellcheck **/*.sh
    inputs:
      - "**/*.sh"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: args

  lint:
    command: "noop"
    deps:
      - "~:lint-sh"

  test:
    command: pnpm exec bats --jobs ${MOON_THREADS:-$(nproc)} tests/ configs/devenv/tests/
    env:
      BATS_LIB_PATH: "$workspaceRoot/node_modules"
    inputs:
      - "/tack.sh"
      - "/tests/**/*"
      - "/configs/devenv/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
