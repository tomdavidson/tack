$schema: "https://moonrepo.dev/schemas/workspace.json"

projects:
  globs:
    - "packages/*"
    - "apps/*"
    - "website"
  sources:
    root: "."

generator:
  templates:
    - ".moon/templates"

vcs:
  provider: "github"
  defaultBranch: "main"
  hooks:
    # pre-commit:
    #   - "moon run :lint-ox-fix --affected --status=staged"
    #   - "moon run :fmt --affected --status=staged -- --incremental=false
    #     --allow-no-files"
    #   - "git diff --cached --name-only --diff-filter=ACMR | xargs git add -f"
    # git diff --quiet && git diff --cached --quiet || (
    #   echo "Dirty working tree. Commit all changes before pushing."
    #   exit 1
    # )
    pre-push:
      - |

          set -euo pipefail

          # Re-entry guard: tidy-push.sh sets this when it pushes a rewritten HEAD itself.
          [[ "${SKIP_PRE_PUSH:-}" == "1" ]] && exit 0

          # Fetch --prune; block branches whose PR already merged or that diverged from the remote.
          .moon/scripts/tidy-push.sh preflight

          branch="$(git branch --show-current)"

          # ---- Trunk detection ----
          detect_trunk() {
            local t

            # 1. Local symbolic ref (fastest; no network)
            t="$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)"
            [[ -n "$t" ]] && { echo "$t"; return 0; }

            # 2. Self-heal: ask origin once, then retry the symbolic ref
            if git remote set-head origin --auto >/dev/null 2>&1; then
              t="$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)"
              [[ -n "$t" ]] && { echo "$t"; return 0; }
            fi

            # 3. git init default (respects user config)
            t="$(git config --get init.defaultBranch 2>/dev/null || true)"
            [[ -n "$t" ]] && { echo "$t"; return 0; }

            # 4. Common remote-tracking branches that actually exist
            for c in main master trunk develop; do
              if git show-ref --verify --quiet "refs/remotes/origin/$c"; then
                echo "$c"; return 0
              fi
            done

            # 5. Last resort
            echo main
          }

          trunk="$(detect_trunk)"

          # ---- Secret scan (runs even on initial push) ----
          moon run root:gitleaks || { echo "gitleaks secret scan failed. Aborting git push."; exit 1; }

          # ---- Initial-push / no-upstream bail-out ----
          has_upstream=0
          git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' >/dev/null 2>&1 && has_upstream=1

          has_remote_refs=0
          git for-each-ref --count=1 refs/remotes/origin/ | grep -q . && has_remote_refs=1

          if (( ! has_upstream )) || (( ! has_remote_refs )); then
            echo "Initial push or no upstream. Skipping vf."
            exit 0
          fi

          # ---- Affected-file query + run refs ----
          if [[ "$branch" == "$trunk" ]]; then
            mapfile -t affected_files < <(moon query changed-files --default-branch | jq -r '.files[]')
            run_refs=(--base "HEAD~1" --head HEAD)

          elif git show-ref --verify --quiet "refs/remotes/origin/$trunk"; then
            mapfile -t affected_files < <(moon query changed-files --base "origin/$trunk" --head HEAD | jq -r '.files[]')
            run_refs=(--base "origin/$trunk" --head HEAD)

          else
            mapfile -t affected_files < <(moon query changed-files --local | jq -r '.files[]')
            run_refs=()
          fi

          # ---- Verify + fix (vf) ----
          moon run :vf --affected "${run_refs[@]}" || { echo "vf failed. Aborting git push."; exit 1; }

          # ---- Stage just the affected files ----
          # Keep only files that currently exist on disk
          existing=()
          for f in "${affected_files[@]}"; do
            [[ -e "$f" ]] && existing+=("$f")
          done

          ((${#existing[@]})) && git add -- "${existing[@]}"

          # Fold staged format fixes into the unpushed commit(s), roll up, merge trunk.
          # If history changed, this pushes the new HEAD itself and exits 1 on purpose.
          .moon/scripts/tidy-push.sh finalize-push

hasher:
  optimization: "accuracy"
