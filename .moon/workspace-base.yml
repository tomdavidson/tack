$schema: "https://moonrepo.dev/schemas/workspace.json"

projects:
  globs:
    - "packages/*"
    - "apps/*"
    - "website"
  sources:
    root: "."

generator:
  templates:
    - ".moon/templates"

vcs:
  provider: "github"
  defaultBranch: "main"
  hooks:
    # pre-commit:
    #   - "moon run :lint-ox-fix --affected --status=staged"
    #   - "moon run :fmt --affected --status=staged -- --incremental=false
    #     --allow-no-files"
    #   - "git diff --cached --name-only --diff-filter=ACMR | xargs git add -f"
    # git diff --quiet && git diff --cached --quiet || (
    #   echo "Dirty working tree. Commit all changes before pushing."
    #   exit 1
    # )
    pre-push:
      - |
        set -euo pipefail
        # Verify-only gate: dirty-tree guard, preflight (merged/diverged),
        # gitleaks, moon run :verify --affected. Never formats, commits, or pushes.
        # Formatting + roll-up happen in `git push` inside the devenv shell
        # (scripts.git shim -> moon run root:tidy -- push), or manually via
        # `moon run root:tidy -- push` outside it.
        .moon/scripts/tidy-push.sh pre-push

hasher:
  optimization: "accuracy"
