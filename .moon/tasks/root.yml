$schema: "https://moonrepo.dev/schemas/tasks.json"

# Workspace root project tasks, inherited only by the `root` project
# (`sources.root: "."` in `.moon/workspace-base.yml`), which is the only
# project whose root directory contains `.moon/workspace.yml`.
# Because the `root` project is declared via `sources.root: "."` and inherits
# its tasks from here, neither tack nor consumer repos need a root `moon.yml`.
inheritedBy:
  file: ".moon/workspace.yml"
  order: 10

tasks:
  sync-release:
    script: "bun $MOON_WORKSPACE_ROOT/.moon/scripts/sync-release-please.ts"
    inputs:
      - "/plugins/*/package.json"
      - "/apps/*/package.json"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    command: "dprint fmt --allow-no-files"
    inputs:
      - "@group(all)"
      - "!**/*.tera*"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      affectedFiles: args

  fmt-check:
    command: "dprint check --allow-no-files"
    inputs:
      - "@group(all)"
      - "!**/*.tera*"
    options:
      runInCI: true
      runFromWorkspaceRoot: true
      affectedFiles: true

  lint-sh:
    script: shellcheck **/*.sh
    inputs:
      - "**/*.sh"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: args

  # `git push` inside the devenv shell runs `moon run root:tidy -- push`
  # (scripts.git shim). Mutates only: fix, stage, roll-up, merge trunk, push.
  # The pre-push hook (`tidy-push.sh pre-push`) does all verification.
  tidy:
    # `command` (not `script`): only command/args accept passthrough args after `--`.
    command: "$workspaceRoot/.moon/scripts/tidy-push.sh"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
      interactive: true
      outputStyle: "stream"

  gitleaks:
    script: "gitleaks git --no-banner --redact"
    inputs:
      - "@group(all)"
    options:
      runFromWorkspaceRoot: true

  lint:
    command: "noop"
    deps:
      - "~:lint-sh"
      - "~:gitleaks"
    options:
      runInCI: true

  lint-fix:
    command: "noop"
    deps:
      - "~:lint-sh"
    options:
      runInCI: false
