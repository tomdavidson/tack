$schema: "https://moonrepo.dev/schemas/tasks.json"

# Workspace root project tasks, inherited only by the `root` project
# (`sources.root: "."` in `.moon/workspace-base.yml`), which is the only
# project whose root directory contains `.moon/workspace.yml`.
# Because the `root` project is declared via `sources.root: "."` and inherits
# its tasks from here, neither tack nor consumer repos need a root `moon.yml`.
inheritedBy:
  file: ".moon/workspace.yml"
  order: 10

tasks:
  sync-release:
    script: "bun $MOON_WORKSPACE_ROOT/.moon/scripts/sync-release-please.ts"
    inputs:
      - "/plugins/*/package.json"
      - "/apps/*/package.json"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  fmt:
    script: "dprint fmt"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
      # Workspace-rooted /**/* returns pnpm's dependency symlinks under
      # packages/*/node_modules despite .gitignore; the hasher then warns
      # "only files can be hashed" for each. See #32.
      - "!**/node_modules/**"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      affectedFiles: args

  fmt-check:
    script: "dprint check"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/*.tera*"
      - "!**/node_modules/**"
    options:
      runInCI: true
      runFromWorkspaceRoot: true
      affectedFiles: true

  lint-sh:
    script: shellcheck **/*.sh
    inputs:
      - "**/*.sh"
    options:
      runFromWorkspaceRoot: true
      affectedFiles: args

  gitleaks:
    script: "gitleaks git --no-banner --redact"
    inputs:
      - "/**/*"
      - "/**/.*"
      - "/**/.*/**/*"
      - "!**/node_modules/**"
    options:
      runFromWorkspaceRoot: true

  lint:
    command: "noop"
    deps:
      - "~:lint-sh"
      - "~:gitleaks"
    options:
      runInCI: true

  lint-fix:
    command: "noop"
    deps:
      - "~:lint-sh"
      - "~:gitleaks"
    options:
      runInCI: false
