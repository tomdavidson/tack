# .moon/tasks/drupal-module.yml
#
# Inherited by all projects tagged "drupal-module" (packages/drupal/*).
# PHP and Composer binaries come from devenv; moon does not manage the toolchain.
#
# ┌──────────────┬───────────────────────────────────────────┐
# │ Use case     │ Command                                     │
# ├──────────────┼───────────────────────────────────────────┤
# │ Lint check   │ moon run ~:lint                             │
# │ Lint fix     │ moon run ~:lint-fix                         │
# │ Static anal  │ moon run ~:analyse                          │
# │ Unit tests   │ moon run ~:test-unit                        │
# │ Integration  │ moon run ~:test  (starts services via devenv)│
# │ Fast CI      │ moon run ~:check  (no services)             │
# │ Full CI      │ moon run ~:check-full                       │
# │ Affected CI  │ moon ci                                     │
# └──────────────┴───────────────────────────────────────────┘
#
# `check` (lint + analyse + test-unit) is the default CI target: fast, no
# services. Use `check-full` or `test` when integration tests are needed.
#
# Per-module overrides go in the module's moon.yml, e.g.:
#   tasks:
#     test-unit:
#       args: ["--testsuite=unit,kernel", "--configuration=phpunit.xml.dist"]

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["drupal-module"]
  order: 10

fileGroups:
  sources:
    - "src/**/*"
    - "*.info.yml"
    - "*.module"
    - "*.install"
    - "*.theme"
  tests:
    - "tests/**/*"
  configs:
    - "phpunit.xml"
    - "phpstan.neon"
    - "phpcs.xml"

tasks:
  lint:
    command: phpcs
    args:
      - "src/"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
    inputs:
      - "@group(sources)"
      - "/phpcs.xml.dist"

  lint-fix:
    extends: lint
    args:
      - "src/"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
      - "--fix"
    options:
      runInCI: false

  analyse:
    command: phpstan
    args:
      - analyse
      - "src/"
      - "--no-progress"
      - "--configuration=$workspaceRoot/phpstan.neon.dist"
    inputs:
      - "@group(sources)"
      - "/phpstan.neon.dist"

  # No services needed. Moon caches this. Fast inner loop.
  test-unit:
    command: phpunit
    args:
      - "--configuration=$workspaceRoot/phpunit.xml.dist"
      - "--no-coverage"
      - "--testsuite=unit"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "/phpunit.xml.dist"

  # Full integration: devenv starts MariaDB + web server, runs ci.sh, stops.
  # Not cached (services are external state). Override in moon.yml to scope
  # to a specific testsuite instead of the full ci.sh.
  test:
    command: devenv
    args: ["test"]
    options:
      cache: false
      runFromWorkspaceRoot: true

  # Default CI target: static checks + unit tests only. No services required.
  check:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test-unit"

  # Full CI target: includes integration tests via devenv test.
  check-full:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test"
    options:
      runInCI: false
