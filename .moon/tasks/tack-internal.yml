$schema: "https://moonrepo.dev/schemas/tasks.json"

# tack-internal tasks. This file exists only in the tack repo: the .moon
# package ignores it (.moon/tack.yml `ignore:`), so consumers never receive
# it. The `file` condition keeps it inert even if it leaked: only a project
# whose root contains tack.sh (tack's own root project) inherits these
# tasks. The shared root moon.yml is a link into .moon/ in every consumer,
# so anything specific to tack itself must live here, not there (ADR-0009).
inheritedBy:
  file: "tack.sh"
  order: 90

tasks:
  test-unit:
    # bats and its helper libs come from the pnpm catalog (package.json),
    # not a system install; bats_load_library resolves them via BATS_LIB_PATH.
    # - `toolchains` declares node/javascript ownership to moon.
    # - `proto activate` puts resolved proto tool dirs (yq, tera) ahead of
    #   ~/.proto/shims so 1,700+ helper calls hit the binaries directly.
    # - `--no-parallelize-within-files` parallelizes across .bats files via GNU
    #   parallel without invoking bats' internal semaphore.bash, which polls
    #   `find | wc -l` and blocks on `sleep 1` per slot wait.
    script: |
      eval "$(proto activate bash --export)"
      pnpm exec bats --jobs "${MOON_THREADS:-$(nproc)}" --no-parallelize-within-files tests/ configs/devenv/tests/
    toolchains: ["javascript", "node"]
    env:
      BATS_LIB_PATH: "$workspaceRoot/node_modules"
    # Root-level tasks default to NO inputs (moon >= 1.24), so without this
    # list the task hash never changes and moon replays the cached result
    # regardless of edits to tack.sh or the suite.
    inputs:
      - "tack.sh"
      - "tackrc.yml"
      - "tackrc-defaults.yml"
      - "tests/**/*"
      - "tests/**/.*"
      - "configs/**/*"
      - "configs/**/.*"
      - ".moon/tack.yml"
      - ".moon/*.yml"
      - ".moon/tasks/**/*"
      - ".moon/templates/**/*"
      - "package.json"
      - "pnpm-lock.yaml"
    options:
      runInCI: true
      runFromWorkspaceRoot: true

  raa-run:
    command: "bash"
    args:
      - "-c"
      - >
          set -euo pipefail;
          PR="${PR_NUMBER:-$(gh pr view --json number --jq .number 2>/dev/null || echo "")}";
          if [ -z "${PR}" ]; then
            echo "Could not determine PR number. Set PR_NUMBER or run from a PR branch.";
            exit 1;
          fi;
          TAG="pr-${PR}";
          echo "Tagging tack preview ${TAG} at $(git rev-parse --short HEAD)";
          git tag -f "${TAG}" HEAD;
          git push origin -f "refs/tags/${TAG}"
    options:
      runInCI: false
      cache: false
      runFromWorkspaceRoot: true

  raa-rm:
    command: "bash"
    args:
      - "-c"
      - >
          set -euo pipefail;
          PR="${PR_NUMBER:-$(gh pr view --json number --jq .number 2>/dev/null || echo "")}";
          if [ -z "${PR}" ]; then
            echo "No PR number available, nothing to remove";
            exit 0;
          fi;
          TAG="pr-${PR}";
          echo "Removing tack preview tag ${TAG}";
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true;
          git tag -d "${TAG}" 2>/dev/null || true
    options:
      runInCI: false
      cache: false
      runFromWorkspaceRoot: true
