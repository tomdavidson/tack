# .moon/tasks/drupal-site.yml
#
# Inherited by all projects tagged "drupal-site" (microsites/*, or the repo root
# when the whole repo is a single Drupal site).
#
# Same lint/analyse/check shape as drupal-module. Adds test-integration,
# test-e2e, and the full devenv test lifecycle. deploy/reset wrap tack scripts.
#
# ┌────────────────┬──────────────────────────────────────────────┐
# │ Use case       │ Command                                             │
# ├────────────────┼──────────────────────────────────────────────┤
# │ Lint check     │ moon run ~:lint                                     │
# │ Lint fix       │ moon run ~:lint-fix                                 │
# │ Static anal    │ moon run ~:analyse                                  │
# │ Unit tests     │ moon run ~:test-unit  (no services, cached)          │
# │ Integration    │ moon run ~:test-integration  (devenv starts services) │
# │ E2E            │ moon run ~:test-e2e  (devenv starts services)        │
# │ Full devenv CI │ moon run ~:test  (devenv test; full ci.sh)           │
# │ Fast CI        │ moon run ~:check  (no services; moon ci default)     │
# │ Full CI        │ moon run ~:check-full                               │
# │ Deploy         │ moon run ~:deploy  (services must be up)             │
# │ Reset          │ moon run ~:reset   (services must be up)             │
# └────────────────┴──────────────────────────────────────────────┘
#
# Service readiness:
#   test-prepare installs Drupal if absent, or deploys if already installed.
#   It reads SIMPLETEST_BASE_URL from $DEVENV_STATE/web.port so the URL is
#   always correct even in shells outside `devenv up`.
#   test-integration and test-e2e depend on test-prepare via deps.
#
# Minimal per-site moon.yml:
#   tags: ["drupal-site"]
# Common overrides:
#   tasks:
#     test-integration:
#       args: ["--testsuite=kernel,custom", "--configuration=phpunit.xml.dist"]
#     reset:
#       env:
#         LOCALGOV_DEMO: "1"

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["drupal-site"]
  order: 10

fileGroups:
  sources:
    - "web/modules/custom/**/*"
    - "web/themes/custom/**/*"
  tests:
    - "tests/**/*"
    - "web/modules/custom/**/tests/**/*"
  configs:
    - "phpunit.xml"
    - "phpunit.xml.dist"
    - "phpstan.neon"
    - "phpstan.neon.dist"
    - "phpcs.xml"
    - "phpcs.xml.dist"
    - "config/sync/**/*"
    - "composer.json"
    - "composer.lock"

tasks:
  lint:
    command: $workspaceRoot/vendor/bin/phpcs
    args:
      - "web/modules/custom"
      - "web/themes/custom"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
    inputs:
      - "@group(sources)"
      - "/phpcs.xml.dist"

  lint-fix:
    command: $workspaceRoot/vendor/bin/phpcbf
    args:
      - "web/modules/custom"
      - "web/themes/custom"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
    options:
      runInCI: false

  analyse:
    command: $workspaceRoot/vendor/bin/phpstan
    args:
      - analyse
      - "web/modules/custom"
      - "web/themes/custom"
      - "--no-progress"
      - "--configuration=$workspaceRoot/phpstan.neon.dist"
    inputs:
      - "@group(sources)"
      - "/phpstan.neon.dist"

  # No services. Cached by moon.
  test-unit:
    command: $workspaceRoot/vendor/bin/phpunit
    args:
      - "--configuration=$workspaceRoot/phpunit.xml.dist"
      - "--no-coverage"
      - "--testsuite=unit"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
      - "/phpunit.xml.dist"
    env:
      SIMPLETEST_BASE_URL: "$SIMPLETEST_BASE_URL"
      SIMPLETEST_DB: "$SIMPLETEST_DB"

  # Brings services up and ensures Drupal is installed/deployed.
  # Reads the real allocated port from $DEVENV_STATE/web.port so
  # SIMPLETEST_BASE_URL is correct in any shell, not just `devenv up`.
  # Installs if settings.php is missing; deploys (updatedb+config:import) otherwise.
  services-up:
    script: |
      devenv up --detach
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  test-prepare:
    script: |
      port=$(cat "$DEVENV_STATE/web.port" 2>/dev/null || echo "${WEB_PORT:-8080}")
      export SIMPLETEST_BASE_URL="http://127.0.0.1:${port}"
      if [ ! -f web/sites/default/settings.php ]; then
        devenv tasks run drupal:setup
      else
        devenv tasks run drupal:deploy
      fi
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Kernel tests. Depends on test-prepare for service + site readiness.
  test-integration:
    script: |
      port=$(cat "$DEVENV_STATE/web.port" 2>/dev/null || echo "${WEB_PORT:-8080}")
      export SIMPLETEST_BASE_URL="http://127.0.0.1:${port}"
      "$workspaceRoot/vendor/bin/phpunit" \
        --configuration="$workspaceRoot/phpunit.xml.dist" \
        --no-coverage \
        --testsuite=kernel
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
      - "/phpunit.xml.dist"
    deps:
      - "~:test-prepare"
    env:
      SIMPLETEST_DB: "$SIMPLETEST_DB"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Functional/browser tests against the live site.
  test-e2e:
    script: |
      port=$(cat "$DEVENV_STATE/web.port" 2>/dev/null || echo "${WEB_PORT:-8080}")
      export SIMPLETEST_BASE_URL="http://127.0.0.1:${port}"
      "$workspaceRoot/vendor/bin/phpunit" \
        --configuration="$workspaceRoot/phpunit.xml.dist" \
        --no-coverage \
        --testsuite=functional
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
      - "/phpunit.xml.dist"
    deps:
      - "~:test-prepare"
    env:
      SIMPLETEST_DB: "$SIMPLETEST_DB"
      BROWSERTEST_OUTPUT_DIRECTORY: "$BROWSERTEST_OUTPUT_DIRECTORY"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Full devenv CI: install + smoke + idempotence + PHPUnit custom suite.
  test:
    command: devenv
    args: ["test"]
    options:
      cache: false
      runFromWorkspaceRoot: true

  # Default CI: static + unit. No services. Cached.
  check:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test-unit"

  # Full CI: all tiers. Explicit opt-in.
  check-full:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test-unit"
      - "~:test-integration"
      - "~:test-e2e"
    options:
      runInCI: false

  # Dev-only: run against already-running services.
  deploy:
    script: "scripts/drupal/deploy.sh"
    inputs:
      - "@group(configs)"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      cache: false

  # Dev-only: drop and reinstall. Set LOCALGOV_DEMO=1 in moon.yml env
  # to enable the demo module via the post-install hook.
  reset:
    script: "scripts/drupal/install.sh --force"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      cache: false
