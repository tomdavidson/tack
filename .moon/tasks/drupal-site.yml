# .moon/tasks/drupal-site.yml
#
# Inherited by all projects tagged "drupal-site" (microsites/*, or the repo root
# when the whole repo is a single Drupal site).
#
# Same lint/analyse/check shape as drupal-module. test-unit runs phpunit without
# services; test delegates to `devenv test` which runs the full ci.sh lifecycle
# (install, smoke, idempotence, PHPUnit custom suite). deploy/reset wrap the
# tack scripts directly and are dev-only (runInCI: false).
#
# ┌──────────────┬─────────────────────────────────────────────────────────────┐
# │ Use case     │ Command                                                     │
# ├──────────────┼─────────────────────────────────────────────────────────────┤
# │ Lint check   │ moon run ~:lint                                             │
# │ Lint fix     │ moon run ~:lint-fix                                         │
# │ Static anal  │ moon run ~:analyse                                          │
# │ Unit tests   │ moon run ~:test-unit  (no services)                         │
# │ Integration  │ moon run ~:test  (devenv test; starts/stops services)        │
# │ Fast CI      │ moon run ~:check  (no services)                             │
# │ Full CI      │ moon run ~:check-full                                       │
# │ Deploy       │ moon run ~:deploy  (dev; services must be up)               │
# │ Reset        │ moon run ~:reset   (dev; services must be up)               │
# └──────────────┴─────────────────────────────────────────────────────────────┘
#
# Minimal per-site moon.yml:
#   tags: ["drupal-site"]
# Override test-unit suite or add LOCALGOV_DEMO for reset:
#   tasks:
#     test-unit:
#       args: ["--testsuite=kernel", "--configuration=phpunit.xml.dist"]
#     reset:
#       env:
#         LOCALGOV_DEMO: "1"

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["drupal-site"]
  order: 10

fileGroups:
  sources:
    - "web/modules/custom/**/*"
    - "web/themes/custom/**/*"
  tests:
    - "tests/**/*"
    - "web/modules/custom/**/tests/**/*"
  configs:
    - "phpunit.xml"
    - "phpunit.xml.dist"
    - "phpstan.neon"
    - "phpcs.xml"
    - "config/sync/**/*"

tasks:
  lint:
    command: phpcs
    args:
      - "web/modules/custom"
      - "web/themes/custom"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
    inputs:
      - "@group(sources)"
      - "/phpcs.xml.dist"

  lint-fix:
    extends: lint
    args:
      - "web/modules/custom"
      - "web/themes/custom"
      - "--standard=$workspaceRoot/phpcs.xml.dist"
      - "--fix"
    options:
      runInCI: false

  analyse:
    command: phpstan
    args:
      - analyse
      - "web/modules/custom"
      - "web/themes/custom"
      - "--no-progress"
      - "--configuration=$workspaceRoot/phpstan.neon.dist"
    inputs:
      - "@group(sources)"
      - "/phpstan.neon.dist"

  # No services needed. Moon caches this.
  test-unit:
    command: phpunit
    args:
      - "--configuration=$workspaceRoot/phpunit.xml.dist"
      - "--no-coverage"
      - "--testsuite=unit"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
      - "/phpunit.xml.dist"
    env:
      SIMPLETEST_BASE_URL: "$SIMPLETEST_BASE_URL"
      SIMPLETEST_DB: "$SIMPLETEST_DB"

  # Full integration: install + smoke + idempotence + PHPUnit custom suite.
  # devenv test starts services, runs enterTest (ci.sh), then stops them.
  # Not cached (external service state).
  test:
    command: devenv
    args: ["test"]
    options:
      cache: false
      runFromWorkspaceRoot: true

  # Default CI target: static + unit only. Fast, no services.
  check:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test-unit"

  # Full CI: includes devenv test integration run.
  check-full:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"
      - "~:test"
    options:
      runInCI: false

  # Dev-only: run deploy.sh against already-running services.
  deploy:
    script: ".tack/configs/drupal/scripts/drupal/deploy.sh"
    inputs:
      - "@group(configs)"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      cache: false

  # Dev-only: drop and reinstall. Set LOCALGOV_DEMO=1 in moon.yml env to
  # enable the demo module via the post-install hook.
  reset:
    script: ".tack/configs/drupal/scripts/drupal/install.sh --force"
    options:
      runInCI: false
      runFromWorkspaceRoot: true
      cache: false
