# tack-manifest.yml for the example fixture package.
# Per-package context (not control). Declares parameters that cannot be
# derived from filename and path: render vars source, concat target,
# link.unfold dirs.

link:
  unfold:
    - nested

files:
  greeting.tera.yml:
    vars_from: tackrc.yml
  clippy-cargo.concat.toml:
    target: Cargo.toml
    enforced:
      - workspace.lints.clippy.unwrap_used
