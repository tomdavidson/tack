$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["astro-website"]
  order: 20

fileGroups:
  astro:
    - "public/**/*"
    - "src/**/*"
    - "astro.config.*"
  sources: []
  tests:
    - "tests/**/*"

tasks:
  # Catch-all for any `astro` command
  astro:
    command: "astro"
    options:
      runInCI: false

  # Typecheck `.astro` and `.ts` files
  typecheck:
    command: "astro"
    args: ["check"]
    toolchains: ["javascript", "node"]
    inputs:
      - "@group(astro)"
      - "@group(sources)"
      - "@group(tests)"
      - "tsconfig.json"
    outputs: []
    options:
      runInCI: true
      mergeArgs: replace

  # Build the application
  build:
    command: "astro build"
    inputs:
      - "@group(astro)"
      - "@group(sources)"
    outputs:
      - "dist"
    options:
      runInCI: true

  # Run the development server
  dev:
    command: "astro dev"
    preset: "server"
    options:
      runInCI: false

  # Serve the built application
  preview:
    command: "astro preview"
    deps:
      - "build"
    preset: "server"
    options:
      runInCI: false
