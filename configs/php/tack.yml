# configs/php/tack.yml
# PHP + Composer language support for devenv.
#
# Delivered as a devenv module, not a devenv.nix fragment (ADR-0009
# decision 6). Import ./.tack/configs/php/php.nix in devenv.nix, or set
# vars.devenv.imports before the initial devenv.nix render:
#   vars:
#     devenv:
#       imports:
#         - ./.tack/configs/php/php.nix
#
# The module sets languages.php.enable/version with lib.mkDefault and
# ships a sandboxed `composer` script. Consumer overrides are plain Nix
# in the consumer's devenv.nix after the import:
#   languages.php.version = "8.4";
#   packages = [ pkgs.php84Packages.composer2 ];
# There are no vars.php.* tackrc keys.
#
# Do NOT also list `composer` in vars.bwrap.tools: php.nix defines
# scripts.composer itself and a second definition is a module conflict.
ignore:
  # read through .tack via `imports` / `extends` / `includes`, never materialized
  - php.nix
  - phpcs-base.xml
  - phpcs.xml
  - phpstan.neon
  - dprint-php.json

files:
  phpcs.copy.xml.dist:
    target: phpcs.xml.dist
    overwrite: false
  phpstan.copy.neon.dist:
    target: phpstan.neon.dist
    overwrite: false
  dprint.merge.json:
    target: dprint.json
  .moon/tasks/php.yml:
    target: .moon/tasks/php.yml
