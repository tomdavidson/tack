# configs/renovate/tack.yml
#
# Shared Renovate rules live in default.json5 (read remotely by Renovate via
# `extends: ["github>tomdavidson/tack//configs/renovate/default.json5"]`).
# .github/renovate.json5 is a seed-once stub (overwrite: false) so consumers
# can add repo-specific packageRules without tack overwriting them (ADR-0009).
ignore:
  - default.json5

mode:
  - copy: ".github/**"
  - link: "**"

files:
  .github/renovate.json5:
    overwrite: false
