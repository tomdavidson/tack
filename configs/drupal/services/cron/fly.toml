# Fly.io config for the Drupal cron service.
# Deploy from the repo root:
#   fly deploy . -c services/cron/fly.toml
#
# dockerfile is relative to fly.toml (i.e. services/cron/Containerfile).

app = "__APP_NAME__-cron"
primary_region = "den"

[build]
  dockerfile = "Containerfile"

[env]
  PHP_MEMORY_LIMIT = "256M"

[processes]
  cron = "/usr/sbin/crond -f -l 8"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
