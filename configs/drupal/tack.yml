# configs/drupal: Drupal application tooling and deployment scaffolding.
#
# Consumer usage in tackrc.yml:
#
#   pkgs:
#     - configs/common
#     - configs/devenv
#     - configs/drupal
#     - configs/drupal/stacks/localgov-multisite
#   vars:
#     project:
#       name: your-org/your-project
#     drupal:
#       stack: localgov-multisite
#
# Override stack defaults in the consumer devenv.nix after the import:
#   imports = [ ./.tack/configs/drupal/stacks/localgov-multisite.nix ];
#   env.HASH_SALT = "your-project-specific-value";
#
# DELIVERED FILES
# ---------------
# phpcs.xml.dist, phpstan.neon.dist, phpunit.xml.dist: delivered once
# (overwrite: false) to the consumer repo root. Check them in and edit
# freely; re-running tack will not clobber your changes.
#
# composer.merge.json: deep-merged into the consumer's composer.json via
# tack's *.merge.json dispatch. Adds a path repository for packages/drupal/*
# and sets minimum-stability: dev / prefer-stable: true.
#
# MOON TASKS AND TEMPLATES (ADR 0008)
# -----------------------------------
# moon/all.yml  -> .moon/tasks/drupal/all.yml  (tack-owned; tags: drupal)
# moon/app.yml  -> .moon/tasks/drupal/app.yml  (tack-owned; drupal + application)
# templates/app.moon.yml -> apps/hub/moon.yml  (seed, overwrite: false)
# templates/drupal-module/ -> .moon/templates/drupal-module/
#   (moon generate drupal-module; scaffolds packages/drupal/<name>/moon.yml)
#
# SERVICES (Fly.io deployment scaffolding)
# ----------------------------------------
# services/cron/ -> services/cron/  (Containerfile, scripts, fly.toml)
# services/db/   -> services/db/    (fly.toml)

path_prefix: .moon

files:
  phpcs.xml.dist:
    target: phpcs.xml.dist
    overwrite: false
  phpstan.neon.dist:
    target: phpstan.neon.dist
    overwrite: false
  phpunit.xml.dist:
    target: phpunit.xml.dist
    overwrite: false
  templates/app.moon.yml:
    target: apps/hub/moon.yml
    overwrite: false
