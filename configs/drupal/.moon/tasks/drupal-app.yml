# .moon/tasks/drupal-app.yml
# Delivered by configs/drupal (tack-owned: re-running tack overwrites it).
# See docs/adrs/0010-moon-task-organization.md.
#
# Inherited only by the Drupal application: tagged "drupal" AND layer
# "application". Modules (layer: library) never get these tasks.
# order: 20 applies this file after drupal-common.yml (order: 10).
#
# ┌──────────────────┬───────────────────────────────────────────────┐
# │ Use case         │ Command                                          │
# ├──────────────────┼───────────────────────────────────────────────┤
# │ Dev stack        │ moon run :dev            (devenv up)             │
# │ Prepare for test │ moon run :test-prepare   (install or deploy)     │
# │ Deploy (dev)     │ moon run :deploy         (services must be up)   │
# │ Reset (dev)      │ moon run :reset          (services must be up)   │
# └──────────────────┴───────────────────────────────────────────────┘
#
# Set LOCALGOV_DEMO=1 on reset in the app moon.yml to enable the demo
# module via the post-install hook.

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["drupal"]
  layers: ["application"]
  order: 20

tasks:
  dev:
    command: "devenv"
    args: ["up"]
    preset: "server"
    options:
      runInCI: false
      runFromWorkspaceRoot: true

  # Installs Drupal if settings.php is missing; otherwise deploys
  # (updatedb + config:import + cr). devenv's task DAG starts MariaDB and
  # the web process before drupal:setup / drupal:deploy run.
  test-prepare:
    script: |
      if [ ! -f web/sites/default/settings.php ]; then
        devenv tasks run drupal:setup
      else
        devenv tasks run drupal:deploy
      fi
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Dev-only: run against already-running services.
  deploy:
    script: ".tack/configs/drupal/scripts/drupal/deploy.sh"
    inputs:
      - "@group(configs)"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  # Dev-only: drop and reinstall.
  reset:
    script: ".tack/configs/drupal/scripts/drupal/install.sh --force"
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
