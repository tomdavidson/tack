# .moon/tasks/drupal/localgov-multisite/microsite.yml
# Delivered by configs/drupal/stacks/localgov-multisite (tack-owned).
# See docs/adrs/0008-moon-task-organization.md.
#
# Inherited by all projects tagged "localgov-microsite".
# Microsite dirs are config/content packages (YAML, Markdown, schema files).
# No PHP, no Drupal install, no test suite. Placeholder: the microsite
# package design (gitops module) is not settled yet.
#
# ┌────────────┬────────────────────────────────────────┐
# │ Use case   │ Command                                    │
# ├────────────┼────────────────────────────────────────┤
# │ Lint check │ moon run :lint                             │
# │ Lint fix   │ moon run :lint-fix                         │
# │ Analyse    │ moon run :analyse                          │
# │ CI check   │ moon run :check   (moon ci default)        │
# │ Plan       │ moon run :plan    (stub; gitops TBD)       │
# │ Apply      │ moon run :apply   (stub; gitops TBD)       │
# └────────────┴────────────────────────────────────────┘
#
# New microsite project: moon generate localgov-microsite
#
# apply may need to run after test-e2e when both are in the same moon run.
# Order them with deps in the microsite moon.yml if needed, e.g.
# deps: ["#drupal-app:test-e2e"]. No mutex: PHPUnit table-prefix isolation
# makes parallel test workers safe without locking.

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["localgov-microsite"]
  order: 10

fileGroups:
  sources:
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.json"
  configs:
    - ".prettierrc*"
    - ".markdownlint*"
    - ".vale.ini"

tasks:
  lint-yaml:
    command: prettier
    args:
      - "--check"
      - "**/*.yml"
      - "**/*.yaml"
    inputs:
      - "@group(sources)"

  lint-md:
    command: markdownlint
    args:
      - "**/*.md"
    inputs:
      - "@group(sources)"

  lint:
    command: noop
    deps:
      - "~:lint-yaml"
      - "~:lint-md"

  lint-yaml-fix:
    extends: lint-yaml
    args:
      - "--write"
      - "**/*.yml"
      - "**/*.yaml"
    options:
      runInCI: false

  lint-md-fix:
    extends: lint-md
    args:
      - "**/*.md"
      - "--fix"
    options:
      runInCI: false

  lint-fix:
    command: noop
    deps:
      - "~:lint-yaml-fix"
      - "~:lint-md-fix"
    options:
      runInCI: false

  validate-schema:
    command: noop
    # swap for yq/CUE/jsonschema invocation when schema tooling is defined
    options:
      runInCI: true

  validate-prose:
    command: vale
    args:
      - "."
    inputs:
      - "@group(sources)"
      - "/.vale.ini"

  analyse:
    command: noop
    deps:
      - "~:validate-schema"
      - "~:validate-prose"

  check:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"

  # Stub — replace when the gitops pattern is defined.
  plan:
    command: noop
    options:
      runInCI: false

  # Stub — replace when the gitops pattern is defined.
  apply:
    command: noop
    options:
      runInCI: false
