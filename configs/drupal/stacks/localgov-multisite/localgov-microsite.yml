# .moon/tasks/localgov-microsite.yml
# Delivered by configs/drupal/stacks/localgov-multisite to
# .moon/tasks/localgov-microsite.yml in the consumer project.
#
# Inherited by all projects tagged "localgov-microsite".
# Microsite dirs are config/content packages (YAML, Markdown, schema files).
# No PHP, no Drupal install, no test suite.
#
# ┌────────────┬────────────────────────────────────────────┐
# │ Use case   │ Command                                    │
# ├────────────┼────────────────────────────────────────────┤
# │ Lint check │ moon run ~:lint                            │
# │ Lint fix   │ moon run ~:lint-fix                        │
# │ Analyse    │ moon run ~:analyse                         │
# │ CI check   │ moon run ~:check  (moon ci default)        │
# │ Plan       │ moon run ~:plan   (stub; gitops TBD)       │
# │ Apply      │ moon run ~:apply  (stub; gitops TBD)       │
# └────────────┴────────────────────────────────────────────┘
#
# Minimal per-microsite moon.yml:
#   tags: ["localgov-microsite"]

$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  tags: ["localgov-microsite"]
  order: 10

fileGroups:
  sources:
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.json"
  configs:
    - ".prettierrc*"
    - ".markdownlint*"
    - ".vale.ini"

tasks:
  lint-yaml:
    command: prettier
    args:
      - "--check"
      - "**/*.yml"
      - "**/*.yaml"
    inputs:
      - "@group(sources)"

  lint-md:
    command: markdownlint
    args:
      - "**/*.md"
    inputs:
      - "@group(sources)"

  lint:
    command: noop
    deps:
      - "~:lint-yaml"
      - "~:lint-md"

  lint-yaml-fix:
    extends: lint-yaml
    args:
      - "--write"
      - "**/*.yml"
      - "**/*.yaml"
    options:
      runInCI: false

  lint-md-fix:
    extends: lint-md
    args:
      - "**/*.md"
      - "--fix"
    options:
      runInCI: false

  lint-fix:
    command: noop
    deps:
      - "~:lint-yaml-fix"
      - "~:lint-md-fix"
    options:
      runInCI: false

  validate-schema:
    command: noop
    # swap for yq/CUE/jsonschema invocation when schema tooling is defined
    options:
      runInCI: true

  validate-prose:
    command: vale
    args:
      - "."
    inputs:
      - "@group(sources)"
      - "/.vale.ini"

  analyse:
    command: noop
    deps:
      - "~:validate-schema"
      - "~:validate-prose"

  check:
    command: noop
    deps:
      - "~:lint"
      - "~:analyse"

  # Stub — replace script when gitops pattern is defined.
  plan:
    command: noop
    options:
      runInCI: false

  # Stub — replace script when gitops pattern is defined.
  # mutex on drupal-db because apply touches live Drupal state.
  apply:
    command: noop
    options:
      runInCI: false
      mutex: "drupal-db"
