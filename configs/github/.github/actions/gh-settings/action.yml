# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
#
# .github/actions/gh-settings/action.yml
#
# Manage per-repo GitHub settings via OpenTofu with a distributed, policy-bound
# merge model. This action is published from the central github-management repo
# and invoked from project repos; it carries the org-wide enforced and default
# configs inside the action itself so project repos cannot weaken policy.
#
# Typical project-repo usage:
#
#   - uses: your-org/github-management/.github/actions/gh-settings@v1
#     with:
#       mode: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
#       repo-settings-path: .github/repo-settings.yml
#       github-token: ${{ secrets.GH_SETTINGS_TOKEN }}
#       oras-registry: ghcr.io/your-org/repo-state
#
# While iterating locally (as in astro-bay), the action lives alongside the
# project and reads enforced/defaults from the action directory.

name: "gh-settings"
description: "Merge org enforced + default GitHub settings with repo overrides, then plan/apply via OpenTofu"

inputs:
  mode:
    required: true
    description: "'plan' or 'apply'"
  repo-settings-path:
    required: false
    default: ".github/repo-settings.yml"
    description: "Path (relative to the calling repo) to the per-repo overrides YAML"
  enforced-path:
    required: false
    default: ""
    description: "Override path to enforced.yml. Defaults to the bundled one in the action."
  defaults-path:
    required: false
    default: ""
    description: "Override path to defaults.yml. Defaults to the bundled one in the action."
  tofu-dir:
    required: false
    default: ""
    description: "Override path to the OpenTofu module. Defaults to the bundled one in the action."
  tofu-version:
    required: false
    default: "1.9.0"
    description: "OpenTofu version to install"
  oras-registry:
    required: false
    default: ""
    description: "OCI registry prefix for state artifacts (e.g. ghcr.io/your-org/repo-state). Empty = local state only."
  github-token:
    required: true
    description: "Token with admin scope on the target repo (GitHub App install token preferred)"

outputs:
  blueprint-path:
    description: "Path to the generated blueprint.auto.tfvars.json"
    value: ${{ steps.merge.outputs.blueprint-path }}
  stripped-keys:
    description: "JSON array of override keys that were stripped because they conflict with enforced policy"
    value: ${{ steps.merge.outputs.stripped-keys }}
  plan-summary:
    description: "Markdown summary of the plan (plan mode only)"
    value: ${{ steps.tofu.outputs.plan-summary }}
  changed:
    description: "'true' if apply made changes"
    value: ${{ steps.tofu.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Resolve paths
      id: paths
      shell: bash
      run: |
        ACTION_DIR="${{ github.action_path }}"
        ENFORCED="${{ inputs.enforced-path }}"
        DEFAULTS="${{ inputs.defaults-path }}"
        TOFU_DIR="${{ inputs.tofu-dir }}"

        echo "enforced=${ENFORCED:-${ACTION_DIR}/config/enforced.yml}" >> "$GITHUB_OUTPUT"
        echo "defaults=${DEFAULTS:-${ACTION_DIR}/config/defaults.yml}" >> "$GITHUB_OUTPUT"
        echo "tofu-dir=${TOFU_DIR:-${ACTION_DIR}/tofu}" >> "$GITHUB_OUTPUT"
        echo "build-dir=${RUNNER_TEMP}/gh-settings-build" >> "$GITHUB_OUTPUT"

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: ${{ inputs.tofu-version }}

    - name: Setup ORAS
      if: inputs.oras-registry != ''
      uses: oras-project/setup-oras@v1

    - name: Merge blueprint
      id: merge
      uses: actions/github-script@v7
      env:
        INPUT_ENFORCED: ${{ steps.paths.outputs.enforced }}
        INPUT_DEFAULTS: ${{ steps.paths.outputs.defaults }}
        INPUT_REPO_SETTINGS: ${{ inputs.repo-settings-path }}
        INPUT_BUILD_DIR: ${{ steps.paths.outputs.build-dir }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const merge = require(`${{ github.action_path }}/merge.js`)
          await merge({ github, context, core, inputs: {
            enforced: process.env.INPUT_ENFORCED,
            defaults: process.env.INPUT_DEFAULTS,
            repoSettings: process.env.INPUT_REPO_SETTINGS,
            buildDir: process.env.INPUT_BUILD_DIR,
          }})

    - name: Pull state from ORAS
      if: inputs.oras-registry != ''
      shell: bash
      env:
        ORAS_REGISTRY: ${{ inputs.oras-registry }}
        TOFU_DIR: ${{ steps.paths.outputs.tofu-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        REPO_NAME="${GITHUB_REPOSITORY##*/}"
        REF="${ORAS_REGISTRY}/${REPO_NAME}:latest"
        mkdir -p "${TOFU_DIR}"
        cd "${TOFU_DIR}"
        echo "${GITHUB_TOKEN}" | oras login "${ORAS_REGISTRY%%/*}" -u "${GITHUB_ACTOR}" --password-stdin
        if oras pull "${REF}" 2>/dev/null; then
          echo "Pulled state from ${REF}"
        else
          echo "No existing state at ${REF}, starting fresh"
        fi

    - name: OpenTofu init + plan/apply
      id: tofu
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TOFU_DIR: ${{ steps.paths.outputs.tofu-dir }}
        BUILD_DIR: ${{ steps.paths.outputs.build-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        cp "${BUILD_DIR}/blueprint.auto.tfvars.json" "${TOFU_DIR}/blueprint.auto.tfvars.json"
        cd "${TOFU_DIR}"

        tofu init -input=false -no-color

        if [[ "${MODE}" == "plan" ]]; then
          tofu plan -input=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1 && EC=$? || EC=$?
          {
            echo "plan-summary<<PLANEOF"
            tail -c 60000 plan.txt
            echo "PLANEOF"
          } >> "$GITHUB_OUTPUT"
          [[ "${EC}" -le 2 ]] || exit "${EC}"
          echo "changed=$([[ "${EC}" == "2" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        elif [[ "${MODE}" == "apply" ]]; then
          tofu apply -input=false -no-color -auto-approve
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "Unknown mode: ${MODE}" >&2
          exit 1
        fi

    - name: Push state to ORAS
      if: inputs.mode == 'apply' && inputs.oras-registry != ''
      shell: bash
      env:
        ORAS_REGISTRY: ${{ inputs.oras-registry }}
        TOFU_DIR: ${{ steps.paths.outputs.tofu-dir }}
      run: |
        set -euo pipefail
        REPO_NAME="${GITHUB_REPOSITORY##*/}"
        REF="${ORAS_REGISTRY}/${REPO_NAME}:latest"
        cd "${TOFU_DIR}"
        [[ -f terraform.tfstate ]] || { echo "No state to push"; exit 0; }
        oras push "${REF}" \
          --artifact-type application/vnd.opentofu.state.v1+json \
          terraform.tfstate:application/json
        echo "Pushed state to ${REF}"

    - name: Comment plan on PR
      if: inputs.mode == 'plan' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        PLAN_SUMMARY: ${{ steps.tofu.outputs.plan-summary }}
        STRIPPED_KEYS: ${{ steps.merge.outputs.stripped-keys }}
        CHANGED: ${{ steps.tofu.outputs.changed }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const comment = require(`${{ github.action_path }}/comment.js`)
          await comment({ github, context, core, inputs: {
            planSummary: process.env.PLAN_SUMMARY,
            strippedKeys: process.env.STRIPPED_KEYS,
            changed: process.env.CHANGED,
          }})
