# .github/repo-settings.yml (example for astro-bay)
# Only non-enforced keys will take effect. Enforced keys are stripped.

description: "Shared Astro plugins and integrations"
homepage_url: "https://github.com/tomdavidson/astro-bay"
topics:
  - astro
  - plugins
  - monorepo
  - moon

has_issues: true
has_discussions: true

merge_controls:
  allow_squash_merge: true
  allow_rebase_merge: true
  allow_merge_commit: false

labels:
  astro: "#7C3AED"
  plugin: "#0EA5E9"
  fuzz: "#F59E0B"
