# Example org-wide defaults.
# A project repo's repo-settings.yml can override any of these.

description: ""
homepage_url: ""
topics: []
has_issues: true
has_projects: false
has_wiki: false
has_discussions: false

merge_controls:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

labels:
  bug: "#d73a4a"
  enhancement: "#a2eeef"
  chore: "#cfd3d7"
