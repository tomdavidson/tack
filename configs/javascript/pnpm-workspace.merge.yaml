packages:
  - ".tack/packages/*"
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "website"

catalog:
  eslint: ^10.13.0
  fast-check: ^3.0.0
  oxlint: ^1.89.0
  oxlint-tsgolint: ^7.0.2005
  typescript: ^5.9.3
  vitest: ^3.0.0

overrides:
  # GHSA-23c5-xmqv-rm74 / GHSA-3ppc-4f35-3m26 / GHSA-7r86-cg39-jmmj: one
  # transitive pins minimatch 10.1.2. 10.2.6 is the last 10.x.
  "minimatch@10": "^10.2.6"

auditConfig:
  # Mirrors osv-scanner.toml. CVE-2026-118764 minimatch globparts
  # amplification: fixed only in 11.0.1, no 10.x backport; dev/lint only.
  # Drop when typescript-eslint and eslint ship on ^11.0.1.
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249

allowBuilds:
  # pnpm 12 ships its Rust binary via @pnpm/exe's install script. Without
  # this, a pnpm that self-provisions from packageManager runs through
  # Node.js and warns on every invocation.
  "@pnpm/exe": true
