$schema: "https://moonrepo.dev/schemas/tasks.json"

# .moon/tasks/typescript.yml
#
# Inherited by all projects with language: "typescript".
# See docs/adrs/0010-moon-task-organization.md.
#
# ┌──────────────┬──────────────────────────────────────────────────┐
# │ Use case     │ Command                                          │
# ├──────────────┼──────────────────────────────────────────────────┤
# │ Lint check   │ moon run ~:lint                                  │
# │ Lint fix     │ moon run ~:lint-fix                              │
# │ Typecheck    │ moon run ~:typecheck                             │
# │ Test         │ moon run ~:test                                  │
# │ Fast verify  │ moon run ~:verify                                │
# │ Verify + fix │ moon run ~:vf                                    │
# │ CI           │ moon ci                                          │
# │ Pre-push     │ moon run :vf --affected                          │
# │ One file     │ moon run ~:lint-es -- src/taxonomy.ts            │
# │ Dev loop     │ bun .moon/scripts/watch-file.ts src/foo.ts -w    │
# └──────────────┴──────────────────────────────────────────────────┘

inheritedBy:
  languages: "typescript"
  order: 10

fileGroups:
  sources:
    - "src/**/*"
    - "types/**/*"
  tests:
    - "src/**/*.spec.ts"
    - "src/**/*.test.ts"
    - "tests/**/*"
  configs:
    - "tsconfig.json"
    - "tsconfig.*.json"

tasks:
  lint-es:
    command: "eslint"
    args:
      - "-c"
      - "$workspaceRoot/eslint.config.mjs"
    toolchains: ["javascript", "node"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "/eslint.config.mjs"

  lint-ox:
    command: "oxlint"
    args:
      - "--config"
      - "$workspaceRoot/oxlintrc.json"
    toolchains: ["javascript", "node"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "/oxlintrc.json"

  lint:
    command: "noop"
    deps:
      - "~:lint-es"
      - "~:lint-ox"
    options:
      runInCI: true

  lint-es-fix:
    extends: "lint-es"
    args: ["--fix"]
    options:
      cache: false
      runInCI: false

  lint-ox-fix:
    extends: "lint-ox"
    args: ["--fix"]
    options:
      cache: false
      runInCI: false

  lint-fix:
    command: "noop"
    deps:
      - "~:lint-es-fix"
      - "~:lint-ox-fix"
    options:
      cache: false
      runInCI: false

  typecheck:
    command: "tsc"
    args:
      - "--noEmit"
    toolchains: ["javascript", "node"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
      - "/tsconfig.*.json"
    options:
      runInCI: true

  test-unit:
    command: "vitest"
    args:
      - "run"
    toolchains: ["javascript", "node"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"
    options:
      runInCI: true

  wf:
    command: "bun"
    args:
      - "$workspaceRoot/.moon/scripts/watch-file.ts"
    toolchains: ["javascript", "node"]
    options:
      persistent: true
      runInCI: false
      cache: false
      outputStyle: "stream"
