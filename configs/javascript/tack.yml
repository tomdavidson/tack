files:
  prototools.merge.toml:
    target: .prototools
  package.merge.json:
    overwrite: false
  pnpm-workspace.merge.yaml:
    overwrite: false

# moon's InheritedTasksManager lstat-walks .moon/ and skips symlinks, so
# anything under .moon must be a real file (see .moon/tack.yml).
mode:
  - copy: ".moon/**"
