# Fits on one screen at a readable font; aim for about 30. Length is a smell,
# cognitive complexity is the limit (toms-clean-code.md Function Shape).
too-many-lines-threshold = 60

# Enforce “2–3 params typical; 4+ suggests a data object” (Clean Code)
too-many-arguments-threshold = 4

# The lintable proxy for "one idea"
cognitive-complexity-threshold = 8

# Flat control flow: no nested branches inside loops
excessive-nesting-threshold = 2

# No boolean parameters; use a 2-variant enum
max-fn-params-bools = 0

# Replace boolean-bag structs with explicit state enums
max-struct-bools = 2
