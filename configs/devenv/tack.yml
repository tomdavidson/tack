# Distributed files with consumer-owned edits: render once, never overwrite.
files:
  devenv.tera.nix:
    overwrite: false
  devenv.tera.yaml:
    overwrite: false
  .envrc:
    overwrite: false

mode:
  - copy: ".envrc"

# bwrap-run.sh and bwrap-apparmor.sh stay inside tack's namespace:
# consumers execute them through the .tack submodule path, so their
# location in the consuming repository has no meaning and they are not
# materialized. bwrap.nix is a devenv module other modules import by
# path (ADR-0009 decision 6), never materialized. The sandbox test suite
# is tack-internal too: it references tack.sh and the template sources,
# which consumers lack.
ignore:
  - bwrap-run.sh
  - bwrap-apparmor.sh
  - bwrap.nix
  - tests/**
