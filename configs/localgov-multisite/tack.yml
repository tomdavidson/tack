# Stack module for LocalGov Drupal multisite (FrankenPHP + MariaDB).
# This file is imported directly by the consumer's devenv.nix at Nix eval
# time; it is never materialized into the consumer repo by tack.
#
# Consumer usage in tackrc.yml:
#   vars:
#     devenv:
#       stack: localgov-multisite

# Nothing to copy/render; the .nix file is imported from .tack/ at eval time.
ignore:
  - devenv.nix
