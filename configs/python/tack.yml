# Python tooling baseline. Enable configs/common, configs/devenv,
# configs/python, and .moon in the consumer's pkgs.
#
# Import ./.tack/configs/python/python.nix in devenv.nix, or set
# vars.devenv.imports before the initial devenv.nix render.
# The module supplies uv and its bwrap wrapper, not a Python interpreter.
#
# Independent projects own pyproject.toml, .python-version, uv.lock,
# and .venv. Add basedpyright and pytest with `uv add --dev` per project.
# No root pyproject or shared uv workspace is generated by this pack.
#
# Formatting: dprint's @dprint/ruff plugin (configs/common/dprint.json,
# "ruff" key). It does not read ruff.toml.
# Linting: `ruff check` via the proto pin in configs/common/.prototools.
# The shared lint rules live in this package's ruff.toml and are never
# materialized; the consumer root gets a seed-once stub (ruff.copy.toml ->
# ruff.toml, overwrite: false) whose only required line is
#   extend = ".tack/configs/python/ruff.toml"
# Consumer overrides go in the stub; submodule bumps update the shared
# rules without touching it. Project-local ruff.toml files extend the
# root stub (`extend = "../../ruff.toml"`) and set target-version.
#
# Moon tasks (ADR-0008 pattern, pack-owned like configs/drupal):
#   .moon/tasks/python.yml -> .moon/tasks/python.yml
# Delivered only when this pack is enabled; projects opt in with
# tags: [python] in moon.yml. The .moon pkg unfolds .moon/tasks so this
# file coexists with the linked rust.yml / typescript.yml.
ignore:
  - python.nix
  # shared rules are read through .tack via `extend`, not delivered
  - ruff.toml

files:
  ruff.copy.toml:
    overwrite: false
  .moon/tasks/python.yml:
    target: .moon/tasks/python.yml
