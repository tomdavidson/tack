# Shared Python LINT baseline, seeded once at the consumer root.
#
# Formatting is NOT configured here. dprint owns `ruff format` through the
# @dprint/ruff plugin; its settings (indent 4, line width from dprint's
# global lineWidth, double quotes, import sorting) live in dprint.json
# under the "ruff" key. Do not add a [format] table to this file; it would
# be ignored by dprint and only confuse editors running ruff directly.
#
# line-length is kept here because `ruff check` uses it for width-aware
# rules (E501 is ignored below, but PLR0913-style heuristics read it).
# Keep it equal to dprint.json "lineWidth".
#
# Interpreter requirements belong to each project. A project-local
# ruff.toml can `extend = "../../ruff.toml"` and set target-version.
line-length = 100
extend-exclude = [".venv", "**/.venv", "**/*.tera.*"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PERF", "S", "T20", "PTH", "RET"]
ignore = ["E501", "PLR0913", "PLR2004"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "T20"]
"**/test_*.py" = ["S101", "T20"]
"**/scripts/**" = ["T20"]
