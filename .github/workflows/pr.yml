name: Pull Request Pipeline

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  config:
    name: CI Strategy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      ci-matrix: ${{ steps.ci-matrix.outputs.matrix }}
      runner-count: ${{ steps.ci-matrix.outputs.count }}
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - uses: ./.github/actions/conventional-pr
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: ci-matrix
        uses: ./.github/actions/moon-ci-matrix

  ci:
    name: Moon CI
    needs: [config]
    if: ${{ fromJson(needs.config.outputs.runner-count || '0') > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.config.outputs.ci-matrix) }}

    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - uses: ./.github/actions/moon-ci
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  osv:
    name: OSV Scanner
    needs: [ci]
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write

  audit:
    name: Audit & SCA
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - name: Run Moon Audit Tasks
        run: |
          has_audit=$(moon query tasks --id '^audit$' | jq 'any(.tasks[]; length > 0)')

          if [[ "$has_audit" == "true" ]]; then
            moon run :audit --affected
          else
            echo "No :audit tasks defined. Skipping."
          fi

  codeql:
    name: CodeQL
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
        with:
          cache-cargo: "false"
          cache-pnpm: "false"
      - uses: github/codeql-action/init@v4
        with:
          languages: actions, javascript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  gate:
    name: PR Gate
    if: always() && github.event.action != 'closed'
    needs: [config, ci, osv, audit, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if [[ "${{ needs.config.result }}" != "success" || \
                "${{ needs.ci.result }}" == "failure" || \
                "${{ needs.ci.result }}" == "cancelled" || \
                "${{ needs.osv.result }}" == "failure" || \
                "${{ needs.osv.result }}" == "cancelled" || \
                "${{ needs.audit.result }}" == "failure" || \
                "${{ needs.audit.result }}" == "cancelled" || \
                "${{ needs.codeql.result }}" == "failure" || \
                "${{ needs.codeql.result }}" == "cancelled" ]]; then
            exit 1
          fi
        shell: bash

  # Review App & Artifacts (RAA)
  # Dispatches raa.yml when gate passes and the review-app label is present.
  review-dispatch:
    name: Dispatch RAA
    needs: [gate]
    if: >-
      !failure() && !cancelled()
      && github.event.action != 'closed'
      && contains(github.event.pull_request.labels.*.name, 'review-app')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Dispatch RAA run
        run: |
          gh workflow run raa.yml \
            --ref "$HEAD_REF" \
            -f command=run \
            -f pr-number="$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Teardown review environment on PR close.
  review-teardown:
    name: Dispatch RAA Teardown
    if: >-
      github.event.action == 'closed'
      && contains(github.event.pull_request.labels.*.name, 'review-app')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Dispatch RAA teardown
        run: |
          gh workflow run raa.yml \
            --ref main \
            -f command=rm \
            -f pr-number="$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
