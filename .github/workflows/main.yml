name: Trunk Pipeline

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: trunk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  config:
    name: CI Strategy
    runs-on: ubuntu-latest
    outputs:
      ci-matrix: ${{ steps.ci-matrix.outputs.matrix }}
      runner-count: ${{ steps.ci-matrix.outputs.count }}
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - id: ci-matrix
        uses: ./.github/actions/moon-ci-matrix

  ci:
    name: Moon CI
    needs: [config]
    if: ${{ fromJson(needs.config.outputs.runner-count || '0') > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.config.outputs.ci-matrix) }}

    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - uses: ./.github/actions/moon-ci
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Audit & SCA
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
      - name: Run Moon Audit Tasks (OSV, Cargo, Gitleaks)
        run: |
          has_audit=$(moon query tasks --id '^audit$' | jq 'any(.tasks[]; length > 0)')

          if [[ "$has_audit" == "true" ]]; then
            moon run :audit
          else
            echo "No :audit tasks defined. Skipping."
          fi

  codeql:
    name: CodeQL
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: tomdavidson/tack/.github/actions/setup@main
        with:
          cache-cargo: "false"
          cache-pnpm: "true"
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  release-please:
    name: Release Please
    needs: [ci, audit, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check release-please files
        shell: bash
        run: |
          release_enabled=false
          if [[ -f .release-please-manifest.json && -f release-please-config.json ]]; then
            release_enabled=true
          fi
          echo "release_enabled=$release_enabled" >> "$GITHUB_OUTPUT"

      - name: Run release-please
        if: ${{ steps.check.outputs.release_enabled == 'true' }}
        uses: googleapis/release-please-action@v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
